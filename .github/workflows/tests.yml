name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: tests-${{ github.ref_name }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # Fast guard - parses every .py file and validates the menu/entity
      # JSON fixtures. Catches the corruption mode that took the suite
      # down once already (truncated menu.json, trailing-NUL .py files).
      # Runs in <5s with no third-party deps so it never blocks on pip.
      - name: Repo integrity guard
        run: python scripts/check_repo_integrity.py

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run pytest
        env:
          PYTHONUNBUFFERED: "1"
          # Required-env stub values - the app aborts on import otherwise.
          # Override with real secrets only in the deploy workflow.
          DEEPGRAM_API_KEY: "ci-stub"
          TWILIO_ACCOUNT_SID: "AC00000000000000000000000000000000"
          TWILIO_AUTH_TOKEN: "ci-stub"
          REDIS_HOST: "localhost"
          REDIS_PORT: "6379"
          PUBLIC_WSS_BASE_URL: "wss://ci.invalid"
        run: pytest -q --maxfail=20
