name: Deploy Compass Voice

on:
  push:
    branches:
      - main
      - dev

concurrency:
  group: compass-voice-${{ github.ref_name }}  # separate lock per branch
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. CACHE MUST BE FIRST — restored before checkout uses it ──
      - name: Cache Git LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: lfs-${{ runner.os }}-${{ hashFiles('.gitattributes') }}-${{ github.ref_name }}
          restore-keys: |
            lfs-${{ runner.os }}-${{ hashFiles('.gitattributes') }}-
            lfs-${{ runner.os }}-

      # ── 2. SINGLE checkout — lfs:true uses the cache above ──
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      # ── 3. Docker build ──
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            arushahmd/compass-voice:${{ github.ref_name }}
            arushahmd/compass-voice:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 4. Deploy to EC2 ──
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd ~/apps/compass-voice
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            docker ps