<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Compass Voice Test Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/ui/styles.css" />
</head>
<body>
  <div class="bg-layer"></div>

  <div class="chat-shell">
    <div class="chat-container">
      <header class="chat-header">
        <div>
          <p class="eyebrow">Compass Voice</p>
          <h1>Order by chat</h1>
        </div>
        <button id="new-chat-btn" class="ghost-btn" type="button">New chat</button>
      </header>

      <section class="chat-status-bar">
        <div id="chat-status" class="status-pill">Starting a new order...</div>
      </section>

      <main id="chat-window" class="chat-window" aria-live="polite"></main>

      <section id="quick-replies" class="quick-replies" aria-label="Suggested replies"></section>

      <footer class="input-area">
        <input
          id="message-input"
          placeholder="Type pickup, delivery, or your order..."
          autocomplete="off"
        />
        <button id="send-btn" class="send-btn" type="button">Send</button>
      </footer>
    </div>
  </div>

  <script src="/ui/chat.js"></script>
</body>
</html>
